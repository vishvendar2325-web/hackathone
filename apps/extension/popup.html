<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FOCUSFLOW Extension</title>
    <style>
      body {
        width: 320px;
        margin: 0;
        padding: 16px;
        background: #090d16;
        color: #f1f5f9;
        font-family: system-ui, sans-serif;
      }
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid #1e293b;
        padding-bottom: 12px;
      }
      .logo {
        font-weight: 800;
        font-size: 16px;
        color: #818cf8;
      }
      .card {
        background: #111827;
        border: 1px solid #1f2937;
        border-radius: 12px;
        padding: 12px;
        margin-top: 12px;
      }
      .stat-num {
        font-size: 28px;
        font-weight: 800;
        color: #38bdf8;
      }
      .btn {
        width: 100%;
        background: #4f46e5;
        color: white;
        border: none;
        padding: 10px;
        border-radius: 8px;
        font-weight: 700;
        cursor: pointer;
        margin-top: 12px;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <span class="logo">⚡ FOCUSFLOW</span>
      <span style="font-size: 11px; color: #10b981;">● Active</span>
    </div>
    <div class="card">
      <div style="font-size: 12px; color: #94a3b8;">Today's Estimated Short Videos</div>
      <div class="stat-num" id="reelsCount">0</div>
      <div style="font-size: 11px; color: #64748b; margin-top: 4px;">Based on observable feed transitions</div>
    </div>
    <button class="btn" id="openWebDashboard">Open FocusFlow Dashboard</button>
  </body>
</html>
